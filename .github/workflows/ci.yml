name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Validate Bonaparte alerting bundle
        run: |
          python3 observability/grafana/validate_bundle.py simulate
          python3 -m unittest discover -s observability/grafana/tests -v

      - name: Check Deno formatting and lint
        run: |
          deno fmt --check supabase/functions workers scripts
          deno lint supabase/functions workers scripts

      - name: Type-check Deno entrypoints
        run: |
          deno check supabase/functions/sherlock-rollout-ingest/index.ts
          deno check --config workers/telemetry-processor/deno.json workers/telemetry-processor/main.ts
          deno check scripts/reduce-activity.ts
          deno check scripts/backfill-frame-evidence.ts
          deno check scripts/backfill-session-scm.ts
          deno check --config workers/telemetry-processor/deno.json workers/telemetry-processor/frame-projector.ts

      - name: Run collector tests
        env:
          PYTHONPATH: packages/telemetry-collector/src
        run: python3 -m unittest discover -s tests/collector -v

      - name: Run Deno unit tests
        run: |
          deno test supabase/functions/sherlock-rollout-ingest
          deno test supabase/functions/sherlock-activity-reducer
          deno test --config workers/telemetry-processor/deno.json --allow-read=railway.toml workers/telemetry-processor

      - name: Verify dashboard
        working-directory: apps/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Start isolated Supabase database and Storage
        run: >-
          supabase start --exclude
          realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run database schema tests
        run: supabase test db --local supabase/tests/database/schema.test.sql

      - name: Run dashboard database integration test
        working-directory: apps/dashboard
        env:
          SHERLOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:postgres

      - name: Run activity reducer database integration test
        env:
          SHERLOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: >-
          deno test --allow-env --allow-net
          supabase/functions/sherlock-activity-reducer/postgres_integration_test.ts

      - name: Run rollout normalizer database integration test
        env:
          SHERLOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: >-
          deno test --allow-env --allow-net
          supabase/functions/sherlock-rollout-ingest/normalizer_postgres_integration_test.ts

      - name: Run queue database integration test
        env:
          SHERLOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: >-
          deno test --config workers/telemetry-processor/deno.json --allow-env --allow-net
          workers/telemetry-processor/queue_integration_test.ts

      - name: Run PostgreSQL reconnect regression
        env:
          SHERLOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: >-
          deno run --config workers/telemetry-processor/deno.json --allow-env --allow-net
          workers/telemetry-processor/postgres_next_write_regression.ts

      - name: Run frame projector database integration test
        env:
          SHERLOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: >-
          deno test --config workers/telemetry-processor/deno.json --allow-env --allow-net
          workers/telemetry-processor/frame-projector_postgres_test.ts

      - name: Run oversized provider end-to-end tests
        env:
          SHERLOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          eval "$(supabase status -o env)"
          SHERLOCK_TEST_SUPABASE_URL="$API_URL" \
          SHERLOCK_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          deno test --config workers/telemetry-processor/deno.json --allow-env --allow-net --allow-read --allow-write --allow-run=python3,node \
            workers/telemetry-processor/oversized_rollout_e2e_test.ts

      - name: Stop isolated Supabase database
        if: always()
        run: supabase stop --no-backup
