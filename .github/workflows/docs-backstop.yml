name: Docs backstop

# COR-5202 part 2. After a PR merges into main with code changes but no docs
# changes, ask Claude to bring AGENTS.md, docs/ and .agents/skills up to date,
# and open a small docs PR for review. It never merges anything.
# Skips cleanly (a notice, green run) while ANTHROPIC_API_KEY is not set for
# this repository. Run it by hand for an already-merged PR with workflow_dispatch.
# Per run: Sonnet, at most 20 turns, $0.50 and 4,000 output tokens per reply.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of an already-merged PR to check
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-backstop-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  backstop:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'docs-backstop/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Skip without the key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Docs backstop skipped (ANTHROPIC_API_KEY is not set for this repository)."

      - name: Resolve the PR
        id: pr
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '
            "merged=\(.merged)",
            "same_repo=\(.head.repo.full_name == .base.repo.full_name)",
            "backstop=\(.head.ref | startswith("docs-backstop/"))",
            "merge_sha=\(.merge_commit_sha)",
            "author=\(.user.login)"' >> "$GITHUB_OUTPUT"
          {
            echo "title<<E3_DOCS_TITLE_EOF"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.title'
            echo "E3_DOCS_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.merged == 'true' && steps.pr.outputs.same_repo == 'true' && steps.pr.outputs.backstop == 'false'
        with:
          ref: ${{ steps.pr.outputs.merge_sha }}
          fetch-depth: 0

      - name: Gate
        id: gate
        if: steps.pr.outputs.merged == 'true' && steps.pr.outputs.same_repo == 'true' && steps.pr.outputs.backstop == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .agents/docs_backstop_gate.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --files-out "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"

      - name: Update docs with Claude
        if: steps.gate.outputs.needed == 'true'
        # Hitting the turn or budget cap must not lose partial edits; the next step decides.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "4000"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model sonnet
            --max-turns 20
            --max-budget-usd 0.50
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git diff:*),Bash(git log:*),Bash(python3 .agents/check_agent_docs.py)"
          prompt: |
            [e3-docs-check v1] Docs backstop for merged PR #${{ env.PR }}: "${{ steps.pr.outputs.title }}".
            It changed code but no docs. The changed code files are listed in ${{ runner.temp }}/changed.txt;
            read them as they are now, and use `git log` to see this PR's commits.
            Check AGENTS.md, docs/README.md (if present) and any skill in .agents/skills/ that covers this area.
            If a command, deploy step, env var, branch, file path, service name or rule they state is now wrong or
            missing because of this PR, fix it with the smallest edit, in the doc that already owns that fact.
            Edit only AGENTS.md, docs/ and .agents/skills/. Do not change code. Do not commit or push.
            Run `python3 .agents/check_agent_docs.py` after editing. If nothing needs changing, make no edit.

      - name: Open docs PR
        if: always() && steps.gate.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          # Keep only edits to the docs Claude may change (the action itself rewrites
          # CLAUDE.md and .claude/ from main, so those never count).
          git restore --staged . 2>/dev/null || true
          git diff --name-only | grep -vE '^(AGENTS\.md|docs/|\.agents/skills/)' | xargs -r git checkout --
          git clean -fdq -e AGENTS.md -e docs -e .agents/skills >/dev/null 2>&1 || true
          paths=$(for p in AGENTS.md docs .agents/skills; do [ -e "$p" ] && echo "$p"; done)
          [ -n "$paths" ] && git add -A -- $paths
          if git diff --cached --quiet; then
            echo "::notice::Docs checked for #$PR: no change needed."
            exit 0
          fi
          python3 .agents/check_agent_docs.py --warn
          branch="docs-backstop/pr-$PR"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "::notice::$branch already exists; not opening a second docs PR."
            exit 0
          fi
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Docs backstop for #$PR" -m "Bring agent docs in line with #$PR ($TITLE)." -m "Docs-Check: updated"
          git push origin "$branch"
          body="Docs follow-up for #$PR, which changed code but no docs. Proposed by the docs backstop (COR-5202); review and merge if right."
          if gh pr create --base main --head "$branch" --title "Docs backstop for #$PR" --body "$body" --assignee "$AUTHOR" \
            || gh pr create --base main --head "$branch" --title "Docs backstop for #$PR" --body "$body"; then
            exit 0
          fi
          # The org or repo may not let Actions open PRs ("Allow GitHub Actions to create
          # and approve pull requests"). Leave the branch and point the author at it.
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          gh pr comment "$PR" --body "Docs backstop (COR-5202): this PR changed code but no docs. A proposed docs update is on branch \`$branch\`. Open it as a PR: $compare" \
            || echo "::warning::Could not comment on #$PR either."
          echo "::warning::Actions may not open PRs here; docs branch $branch is ready: $compare"
